{% assign enlace = page.url | absolute_url %}{% capture mensaje %}{{ page.title }} {{ enlace }}{% endcapture %}
<div class="compartir">
  <p class="compartir-t">Envíasela a otra madre que espera</p>
  <a class="boton boton-claro" href="https://wa.me/?text={{ mensaje | url_encode }}" target="_blank" rel="noopener">WhatsApp</a>
  <button class="boton boton-claro" type="button" data-enlace="{{ enlace }}" onclick="copiarEnlace(this)">Copiar enlace</button>
  <span class="compartir-aviso" role="status" aria-live="polite"></span>
</div>
