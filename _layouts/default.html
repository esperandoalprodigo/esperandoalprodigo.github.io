<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/JosefinSans-300-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/Lato-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/estilo.css' | relative_url }}">
{% seo %}
{% assign img_compartir = page.imagen | default: "/assets/compartir.png" %}
<meta property="og:image" content="{{ img_compartir | absolute_url }}">
<meta name="twitter:image" content="{{ img_compartir | absolute_url }}">
{% feed_meta %}
</head>
<body class="tema-{{ site.data.ajustes.contraste | default: 'nitido' }}">
{% if page.layout == "entrada" or page.layout == "catecismo" %}<div class="progreso" aria-hidden="true"></div>{% endif %}
<a class="saltar" href="#contenido">Saltar al contenido</a>
{% include cabecera.html %}
<main id="contenido">
{{ content }}
</main>
{% include pie.html %}
<script src="{{ '/assets/movimiento.js' | relative_url }}"></script>
</body>
</html>
